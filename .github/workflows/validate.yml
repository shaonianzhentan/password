# 仓库校验：hassfest（HA 官方）+ HACS action。
#
# hassfest 校验 manifest/translations/brand/目录结构，是进入 HA 官方
# 集成目录（以及 2026.11 内置的 Marketplace 按 categories 归类）的硬门槛；
# HACS action 用与市场相同的代码校验仓库，缺 categories 会 warn、
# categories 值非法会 fail。
#
# 定期跑一次：HACS 与 hassfest 的规则本身会随 HA 版本变化，
# 不跑代码也可能某天开始失败（例如 categories 值改名）。
name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
